version: '3.8'

services:
  # 1. Primary Relational Database
  postgres:
    image: postgres:15-alpine
    container_name: academic_recovery_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-academic_recovery}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-academic_recovery}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - academic_network

  # 2. ChromaDB Vector Store for RAG Pipeline
  chromadb:
    image: chromadb/chroma:latest
    container_name: academic_recovery_chroma
    restart: unless-stopped
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    ports:
      - "${CHROMA_HOST_PORT:-8001}:8000"
    volumes:
      - chroma_store:/chroma/chroma
    networks:
      - academic_network

  # 3. External Mock Attendance Microservice
  mock_attendance_system:
    build:
      context: ../backend
      dockerfile: Dockerfile.mock
    container_name: academic_recovery_mock_attendance
    command: ["uvicorn", "mock_services.mock_attendance_system:app", "--host", "0.0.0.0", "--port", "9001"]
    restart: unless-stopped
    ports:
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:9001/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - academic_network

  # 4. External Mock Lesson Plan Microservice
  mock_lesson_plan_system:
    build:
      context: ../backend
      dockerfile: Dockerfile.mock
    container_name: academic_recovery_mock_lesson_plan
    command: ["uvicorn", "mock_services.mock_lesson_plan_system:app", "--host", "0.0.0.0", "--port", "9002"]
    restart: unless-stopped
    ports:
      - "9002:9002"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:9002/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - academic_network

  # 5. FastAPI Backend Application
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: academic_recovery_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-academic_recovery}
      - CHROMA_PATH=/app/chroma_data
      - CHROMA_DB_URL=http://chromadb:8000
      - JWT_SECRET=${JWT_SECRET:-supersecretjwtkey_change_in_production}
      - SMTP_SERVER=${SMTP_SERVER:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - ATTENDANCE_SYSTEM_URL=http://mock_attendance_system:9001
      - LESSON_PLAN_SYSTEM_URL=http://mock_lesson_plan_system:9002
      - OPENAI_API_KEY=${OPENAI_API_KEY:-mock_openai_api_key}
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_data
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
      mock_attendance_system:
        condition: service_healthy
      mock_lesson_plan_system:
        condition: service_healthy
    networks:
      - academic_network

  # 6. Next.js Frontend Application
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: academic_recovery_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - academic_network

volumes:
  postgres_data:
    name: academic_recovery_postgres_data
  chroma_store:
    name: academic_recovery_chroma_store
  chroma_data:
    name: academic_recovery_chroma_data

networks:
  academic_network:
    name: academic_recovery_network
    driver: bridge
