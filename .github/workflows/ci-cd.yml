name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Backend CI: Run Pytest Test Suite
  # =========================================================================
  backend-test:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Pytest Suite
        env:
          PYTHONPATH: "."
          DATABASE_URL: "sqlite:///./test_ci.db"
          CHROMA_PATH: "./test_ci_chroma"
          JWT_SECRET: "ci_test_jwt_secret_key_12345"
          ENVIRONMENT: "testing"
        run: |
          pytest tests -v

  # =========================================================================
  # 2. Frontend CI: Linting & TypeScript Type Checking
  # =========================================================================
  frontend-check:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run TypeScript Type Check
        working-directory: ./frontend
        run: npm run type-check

  # =========================================================================
  # 3. CD: Deploy on Merge to Main
  # =========================================================================
  deploy:
    name: Deploy to Production
    needs: [backend-test, frontend-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Deploy Backend to Render (via Deploy Hook)
      - name: Deploy Backend to Render
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render backend deployment..."
          curl -s -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deployment triggered successfully."

      # Deploy Backend to Railway (Optional alternative via Railway Token)
      - name: Deploy Backend to Railway
        if: env.RAILWAY_TOKEN != ''
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "Deploying to Railway via Railway CLI..."
          npm install -g @railway/cli
          railway up --service backend --detach

      # Deploy Frontend to Vercel (via Deploy Hook or Vercel CLI)
      - name: Deploy Frontend to Vercel
        if: env.VERCEL_DEPLOY_HOOK_URL != ''
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Vercel frontend deployment..."
          curl -s -X POST "$VERCEL_DEPLOY_HOOK_URL"
          echo "Vercel deployment triggered successfully."
